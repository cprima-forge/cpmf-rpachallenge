# Jekyll configuration for GitHub Pages
# GitHub Actions workflow builds from ./apps/ directory

# Base URL for the site (repository name)
baseurl: /cpmf-rpachallenge

# GitHub Pages URL
url: https://cprima-forge.github.io

# Disable Jekyll processing for raw content
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md

# Keep files that start with underscore or dot
keep_files:
  - .nojekyll
  - .git

# Disable Jekyll plugins that might interfere
plugins: []

# Use absolute permalinks
permalink: pretty
