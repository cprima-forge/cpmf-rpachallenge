<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPA Challenge</title>
  <link rel="stylesheet" href="css/solarized.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>RPA Challenge</h1>
      <p>Complete all <span id="headerRounds">10</span> rounds as fast as possible</p>
      <div class="header-actions">
        <button id="generateExcelBtn" class="download-link">Generate & Download Excel</button>
        <button id="toggleDataBtn" class="download-link">Show/Hide Data Table</button>
      </div>
    </header>

    <div id="dataTableContainer" class="data-table-container" style="display:none;">
      <h2>Challenge Data (Source of Truth)</h2>
      <table id="dataTable" class="data-table">
        <!-- Populated by JavaScript from CHALLENGE_DATA -->
      </table>
    </div>

    <div class="challenge-area">
      <div class="stats">
        <div class="timer">Time: <span id="timer">00:00.000</span></div>
        <div class="round">Round: <span id="round">0</span> / <span class="total-rounds">10</span></div>
      </div>

      <button class="uiColorButton" id="startBtn">START</button>

      <form id="challengeForm" style="display:none;">
        <!-- Fields will be injected by form-manager.js -->
      </form>

      <div class="congratulations" style="display:none;">
        <div class="message1">Congratulations!</div>
        <div class="message2" id="resultMessage"></div>
      </div>
    </div>
  </div>

  <script src="assets/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/form-manager.js"></script>
  <script src="js/data-table.js"></script>
  <script src="js/excel-generator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
