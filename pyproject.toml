[project]
name = "cpmf-rpachallenge"
version = "0.1.0"
description = "Playwright selectors and utilities for rpachallenge.com automation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Christian Prior-Mamulyan", email = "cprior@gmail.com" },
]
keywords = [
    "rpa",
    "rpachallenge",
    "playwright",
    "automation",
    "selectors",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
screenshots = [
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/cprima-forge/cpmf-rpachallenge"
Source = "https://github.com/cprima-forge/cpmf-rpachallenge"
Issues = "https://github.com/cprima-forge/cpmf-rpachallenge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpmf_rpachallenge"]
